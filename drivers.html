<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pulse - Driver Standings</title>
    <meta name="description" content="Formula 1 driver championship standings with real-time points, wins, and driver profiles.">
    <meta name="theme-color" content="#07080c">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="F1 Pulse">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta property="og:type" content="website">
    <meta property="og:title" content="F1 Pulse — Driver Intelligence">
    <meta property="og:description" content="Live Formula 1 driver standings, form, comparisons and detailed profiles.">
    <meta property="og:image" content="/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/og.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/pages/standings.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 760px)">
    <link rel="stylesheet" href="css/finish.css">
</head>
<body>
    <nav id="main-nav"></nav>

    <main class="page-content">
        <div class="container">
            <div class="page-header">
                <h1>Driver <span class="text-red">Standings</span></h1>
                <p class="subtitle" id="season-label">Loading current season...</p>
            </div>

            <!-- View Toggle -->
            <div class="tabs" id="view-tabs" role="tablist" aria-label="Driver standings view">
                <button class="tab-btn active" id="drivers-grid-tab" role="tab" aria-selected="true" aria-controls="drivers-grid" data-view="grid" onclick="switchView('grid')">Grid</button>
                <button class="tab-btn" id="drivers-table-tab" role="tab" aria-selected="false" aria-controls="drivers-table" data-view="table" onclick="switchView('table')">Table</button>
            </div>

            <!-- Driver Grid View -->
            <div id="drivers-grid" class="grid-4" role="tabpanel" aria-labelledby="drivers-grid-tab"></div>

            <!-- Driver Table View -->
            <div id="drivers-table" role="tabpanel" aria-labelledby="drivers-table-tab" style="display:none"></div>
        </div>
    </main>

    <footer id="main-footer"></footer>

    <script src="js/api.js"></script>
    <script src="js/experience.js"></script>
    <script src="js/components.js"></script>
    <script src="js/drivers.js"></script>
</body>
</html>
