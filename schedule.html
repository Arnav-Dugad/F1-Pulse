<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pulse - Race Calendar</title>
    <meta name="description" content="Complete Formula 1 race calendar with dates, circuits, and results for every Grand Prix.">
    <meta name="theme-color" content="#07080c">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="F1 Pulse">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta property="og:type" content="website">
    <meta property="og:title" content="F1 Pulse — Race Calendar">
    <meta property="og:description" content="Every Formula 1 race weekend, session time, circuit and result in one place.">
    <meta property="og:image" content="/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/og.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/pages/schedule.css">
    <link rel="stylesheet" href="css/premium.css">
</head>
<body>
    <nav id="main-nav"></nav>

    <main class="page-content">
        <div class="container">
            <div class="page-header">
                <div class="flex-between" style="flex-wrap:wrap;gap:16px">
                    <div>
                        <h1>Race <span class="text-red">Calendar</span></h1>
                        <p class="subtitle" id="season-label">Loading schedule...</p>
                    </div>
                    <div class="season-selector">
                        <label class="sr-only" for="season-select">Select championship season</label>
                        <select id="season-select" aria-label="Select championship season" onchange="loadSeason(this.value)"></select>
                    </div>
                </div>
            </div>

            <!-- Race Grid -->
            <div id="races-container" class="grid-3"></div>
        </div>
    </main>

    <footer id="main-footer"></footer>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
