<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pulse - Race Details</title>
    <meta name="description" content="Detailed Formula 1 race results including qualifying, race positions, pit stops, tire strategy, and fastest laps.">
    <meta name="theme-color" content="#07080c">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="F1 Pulse">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta property="og:type" content="article">
    <meta property="og:title" content="F1 Pulse — Race Centre">
    <meta property="og:description" content="Deep Formula 1 race results, qualifying, strategy, weather and circuit intelligence.">
    <meta property="og:image" content="/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/og.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/pages/race.css">
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="race-detail-page">
    <nav id="main-nav"></nav>

    <main class="page-content">
        <div class="container">
            <div class="page-header" id="race-header">
                <h1 id="race-title">Loading Race...</h1>
                <p class="subtitle" id="race-subtitle"></p>
            </div>

            <div class="race-info-grid" id="race-info" style="display:none"></div>

            <section class="section" id="weather-section" style="display:none;margin-top:24px">
                <div class="section-header"><h2>Weather Conditions</h2></div>
                <div id="weather-container"></div>
            </section>

            <div class="tabs" id="result-tabs" role="tablist" aria-label="Race result categories" style="margin-top:32px;display:none">
                <button class="tab-btn active" id="race-tab" role="tab" aria-selected="true" aria-controls="race-results" data-tab="race" onclick="switchTab('race')">Race</button>
                <button class="tab-btn" id="qualifying-tab" role="tab" aria-selected="false" aria-controls="qualifying-results" tabindex="-1" data-tab="qualifying" onclick="switchTab('qualifying')">Qualifying</button>
                <button class="tab-btn" id="sprint-tab" role="tab" aria-selected="false" aria-controls="sprint-results" tabindex="-1" data-tab="sprint" onclick="switchTab('sprint')">Sprint</button>
                <button class="tab-btn" id="pitstops-tab" role="tab" aria-selected="false" aria-controls="pitstops-results" tabindex="-1" data-tab="pitstops" onclick="switchTab('pitstops')">Pit Stops</button>
                <button class="tab-btn" id="tires-tab" role="tab" aria-selected="false" aria-controls="tires-results" tabindex="-1" data-tab="tires" onclick="switchTab('tires')" style="display:none">Tire Strategy</button>
                <button class="tab-btn" id="laptimes-tab" role="tab" aria-selected="false" aria-controls="laptimes-results" tabindex="-1" data-tab="laptimes" onclick="switchTab('laptimes')" style="display:none">Lap Times</button>
                <button class="tab-btn" id="teamradio-tab" role="tab" aria-selected="false" aria-controls="teamradio-results" tabindex="-1" data-tab="teamradio" onclick="switchTab('teamradio')" style="display:none">Team Radio</button>
                <button class="tab-btn" id="racecontrol-tab" role="tab" aria-selected="false" aria-controls="racecontrol-results" tabindex="-1" data-tab="racecontrol" onclick="switchTab('racecontrol')" style="display:none">Race Control</button>
            </div>

            <div id="podium-container" style="display:none"></div>

            <div id="race-results" role="tabpanel" aria-labelledby="race-tab"></div>
            <div id="qualifying-results" role="tabpanel" aria-labelledby="qualifying-tab" style="display:none"></div>
            <div id="sprint-results" role="tabpanel" aria-labelledby="sprint-tab" style="display:none"></div>
            <div id="pitstops-results" role="tabpanel" aria-labelledby="pitstops-tab" style="display:none"></div>
            <div id="tires-results" role="tabpanel" aria-labelledby="tires-tab" style="display:none"></div>
            <div id="laptimes-results" role="tabpanel" aria-labelledby="laptimes-tab" style="display:none"></div>
            <div id="teamradio-results" role="tabpanel" aria-labelledby="teamradio-tab" style="display:none"></div>
            <div id="racecontrol-results" role="tabpanel" aria-labelledby="racecontrol-tab" style="display:none"></div>

            <div id="upcoming-info" style="display:none"></div>
        </div>
    </main>

    <footer id="main-footer"></footer>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/race-detail.js"></script>
</body>
</html>
