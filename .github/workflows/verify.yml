name: Verify F1 Pulse
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks (every route, three viewports, both themes)
        run: |
          node scripts/serve.mjs &
          sleep 2
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: artifacts/

  visual:
    # Pixel comparison against tests/visual/*.linux.png using recorded API fixtures (no live data).
    # Non-blocking until Linux baselines are committed: a missing baseline is uploaded as "new".
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Visual regression
        run: |
          PULSE_PORT=8811 node scripts/serve.mjs &
          sleep 2
          PULSE_TEST_URL=http://127.0.0.1:8811 npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: artifacts/visual/

  lighthouse:
    # Budgets (desktop preset): performance >= 0.8, CLS < 0.1, LCP < 2.5 s. Warn-only for now.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            artifacts/lighthouse/
            .lighthouseci/
